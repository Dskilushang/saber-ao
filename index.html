<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABER AO - Jeu de Culture Générale</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #071026; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        #accueil { text-align: center; padding: 40px 20px; width: 100%; max-width: 500px; margin-top: 50px; }
        .logo-emoji { font-size: 80px; margin-bottom: 10px; display: inline-block; background: #131e36; padding: 20px; border-radius: 50%; border: 3px solid #ffd24d; }
        h1 { color: #ffd24d; font-size: 36px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: #aaa; margin-bottom: 30px; font-size: 16px; }
        
        .btn-langue { display: block; width: 100%; background: #131e36; color: white; border: 1px solid #ffd24d; padding: 15px; margin: 8px 0; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-langue:hover { background: #ffd24d; color: #071026; }

        #jeu { display: none; width: 100%; max-width: 600px; padding: 20px; flex-direction: column; flex: 1; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .box-info { background: #131e36; padding: 10px 15px; border-radius: 12px; border: 1px solid #1f2d4a; text-align: center; min-width: 80px; }
        .label { color: #8892b0; font-size: 10px; font-weight: bold; display: block; }
        .valeur { color: #ffd24d; font-size: 20px; font-weight: bold; }
        .chrono-alerte .valeur { color: #dc3545; }
        .mascotte { font-size: 40px; text-align: center; }

        .card-question { background: #131e36; border-radius: 15px; padding: 20px; margin-bottom: 20px; border-left: 5px solid #ffd24d; text-align: center; }
        .num-q { color: #8892b0; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        .text-q { font-size: 20px; font-weight: bold; }

        .reponses { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .btn-reponse { background: #131e36; color: white; border: 1px solid #1f2d4a; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-reponse:hover:not(:disabled) { background: #1f2d4a; }
        .btn-reponse.correct { background: #28a745; border-color: #1e7e34; }
        .btn-reponse.faux { background: #dc3545; border-color: #bd2130; }
        .btn-reponse:disabled { opacity: 0.7; cursor: not-allowed; }

        .gadgets { display: flex; justify-content: space-around; margin-top: 20px; padding-top: 15px; border-top: 1px solid #131e36; }
        .btn-gadget { background: #ffd24d; color: #071026; border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-gadget:disabled { background: #333; color: #666; opacity: 0.5; cursor: not-allowed; }

        .grid-images { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .img-card { background: #131e36; padding: 10px; border-radius: 12px; width: 45%; text-align: center; cursor: pointer; border: 2px solid #1f2d4a; }
        .img-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .img-card.correct { border-color: #28a745; background: #1a3a2a; }
        .img-card.faux { border-color: #dc3545; background: #3a1a1a; }
    </style>
</head>
<body>

    <div id="accueil">
        <div class="logo-emoji">🇦🇴</div>
        <h1>SABER AO</h1>
        <p class="subtitle">Escolha o idioma / Choisissez la langue :</p>
        <div id="liste-langues"></div>
    </div>

    <div id="jeu">
        <div class="top-bar">
            <div class="box-info">
                <span class="label">SCORE</span>
                <span class="valeur" id="score">0</span>
            </div>
            <div class="mascotte">🦁</div>
            <div class="box-info" id="box-chrono">
                <span class="label">CHRONO</span>
                <span class="valeur" id="chrono">30s</span>
            </div>
        </div>

        <div class="card-question">
            <div class="num-q" id="num-q">Q1/5</div>
            <div class="text-q" id="text-q">Chargement...</div>
        </div>

        <div id="zone-reponses" class="reponses"></div>

        <div class="gadgets">
            <button class="btn-gadget" id="btn-5050" onclick="utiliserGadget('5050')">50/50</button>
            <button class="btn-gadget" id="btn-genie" onclick="utiliserGadget('genie')">🧞‍♂️ Génie</button>
            <button class="btn-gadget" id="btn-temps" onclick="utiliserGadget('temps')">⏸️ +10s</button>
        </div>
    </div>

    <script>
        const LANGUES = [
            { code: 'fr', label: 'Français' }, { code: 'pt', label: 'Português' },
            { code: 'en', label: 'English' }, { code: 'kg', label: 'Kikongo' },
            { code: 'ln', label: 'Lingála' }, { code: 'kj', label: 'Kimbundu' },
            { code: 'umb', label: 'Umbundu' }
        ];

        const QUESTIONS_LOCALES = {
            fr: [
                { type: 'text', text: "Quelle est la capitale de l'Angola ?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 },
                { type: 'text', text: "Quelle est la monnaie officielle d'Angola ?", answers: ["Kwanza", "Franc", "Real", "Dollar"], correctAnswerIndex: 0 },
                { type: 'text', text: "En quelle année l'Angola est-il devenu indépendant ?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 },
                { type: 'text', text: "Quel style musical moderne est originaire d'Angola ?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 },
                { type: 'text', text: "Quel est le plus long fleuve d'Angola ?", answers: ["Kwanza", "Congo", "Zambèze", "Cunene"], correctAnswerIndex: 0 }
            ],
            pt: [
                { type: 'text', text: "Qual é a capital de Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 },
                { type: 'text', text: "Qual é a moeda oficial de Angola?", answers: ["Kwanza", "Franco", "Real", "Dólar"], correctAnswerIndex: 0 },
                { type: 'text', text: "Em que ano Angola tornou-se independente?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 },
                { type: 'text', text: "Qual estilo musical é originário de Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 },
                { type: 'text', text: "Qual é o rio mais longo de Angola?", answers: ["Kwanza", "Congo", "Zambeze", "Cunene"], correctAnswerIndex: 0 }
            ],
            en: [
                { type: 'text', text: "What is the capital of Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 },
                { type: 'text', text: "What is the official currency of Angola?", answers: ["Kwanza", "Franc", "Real", "Dollar"], correctAnswerIndex: 0 },
                { type: 'text', text: "In which year did Angola gain independence?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 },
                { type: 'text', text: "Which music genre originates from Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 },
                { type: 'text', text: "What is the longest river in Angola?", answers: ["Kwanza", "Congo", "Zambezi", "Cunene"], correctAnswerIndex: 0 }
            ],
            kg: [ { type: 'text', text: "Nki i mbanza ya ntotila ya Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 }, { type: 'text', text: "Nki i nzimbu ya nsi ya Angola?", answers: ["Kwanza", "Franc", "Real", "Dollar"], correctAnswerIndex: 0 }, { type: 'text', text: "Nki mvu Angola banzikisa kimpwanza?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 }, { type: 'text', text: "Nki mutindu ya miziki ukatuka mu Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }, { type: 'text', text: "Nki i nzadi ya nene mu Angola?", answers: ["Kwanza", "Congo", "Zambezi", "Cunene"], correctAnswerIndex: 0 } ],
            ln: [ { type: 'text', text: "Mbonge nini ezali engumba bokonzi ya Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 }, { type: 'text', text: "Mbongo nini esalelamaka na Angola?", answers: ["Kwanza", "Franc", "Real", "Dollar"], correctAnswerIndex: 0 }, { type: 'text', text: "Mobu nini Angola ezwaki lipanda?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 }, { type: 'text', text: "Miziki nini eutaki na mboka Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }, { type: 'text', text: "Ebale nini ezali ya molai koleka na Angola?", answers: ["Kwanza", "Congo", "Zambezi", "Cunene"], correctAnswerIndex: 0 } ],
            kj: [ { type: 'text', text: "Ihi i mbanza ia mbota ia Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 }, { type: 'text', text: "Ihi i kitadi kia nsi ia Angola?", answers: ["Kwanza", "Franco", "Real", "Dólar"], correctAnswerIndex: 0 }, { type: 'text', text: "Mu muvu uhi Angola iatambula utuminu?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 }, { type: 'text', text: "Muzika uhi utunda mu Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }, { type: 'text', text: "Ihi i mbo ya nene mu Angola?", answers: ["Kwanza", "Congo", "Zambezi", "Cunene"], correctAnswerIndex: 0 } ],
            umb: [ { type: 'text', text: "Helie ofekalupale yo Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 }, { type: 'text', text: "Orombongo ipi vielinga vokalunga ko Angola?", answers: ["Kwanza", "Franco", "Real", "Dólar"], correctAnswerIndex: 0 }, { type: 'text', text: "Ulimbo upi Angola viawile elianjo?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 }, { type: 'text', text: "Owisikihulo upi utunda ko Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }, { type: 'text', text: "Omunyi upi ulikola ko Angola?", answers: ["Kwanza", "Congo", "Zambezi", "Cunene"], correctAnswerIndex: 0 } ]
        };

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval;
        let gadgets = { '5050': true, 'genie': true, 'temps': true };
        let currentLang = 'fr';

        function init() {
            const liste = document.getElementById('liste-langues');
            LANGUES.forEach(lang => {
                const btn = document.createElement('button');
                btn.className = 'btn-langue';
                btn.innerText = lang.label;
                btn.onclick = () => startGame(lang.code);
                liste.appendChild(btn);
            });
        }

        async function startGame(lang) {
            currentLang = lang;
            document.getElementById('accueil').style.display = 'none';
            document.getElementById('jeu').style.display = 'flex';
            
            score = 0;
            currentIndex = 0;
            gadgets = { '5050': true, 'genie': true, 'temps': true };
            updateGadgetsUI();
            updateScore();

            try {
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 3000);
                const res = await fetch(`https://saber-ao-backend.onrender.com/api/questions?lang=${lang}`, { signal: controller.signal });
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) questions = data;
                else questions = QUESTIONS_LOCALES[lang] || QUESTIONS_LOCALES['pt'];
            } catch (e) {
                questions = QUESTIONS_LOCALES[lang] || QUESTIONS_LOCALES['pt'];
            }
            
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= questions.length) {
                endGame();
                return;
            }
            const q = questions[currentIndex];
            document.getElementById('num-q').innerText = `Q${currentIndex + 1}/${questions.length}`;
            document.getElementById('text-q').innerText = q.text;
            
            const zone = document.getElementById('zone-reponses');
            zone.innerHTML = '';
            zone.className = 'reponses';

            if (q.type === 'image') {
                zone.className = 'grid-images';
                q.answers.forEach((url, i) => {
                    const div = document.createElement('div');
                    div.className = 'img-card';
                    div.innerHTML = `<img src="${url}" alt="Option ${i+1}"><div style="color:#ffd24d; margin-top:5px; font-weight:bold;">Option ${String.fromCharCode(65+i)}</div>`;
                    div.onclick = () => checkAnswer(i, div);
                    zone.appendChild(div);
                });
            } else {
                q.answers.forEach((ans, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-reponse';
                    btn.innerText = ans;
                    btn.onclick = () => checkAnswer(i, btn);
                    zone.appendChild(btn);
                });
            }
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            updateTimerUI();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("⏱️ Temps écoulé !");
                    nextQuestion();
                }
            }, 1000);
        }

        function checkAnswer(index, element) {
            clearInterval(timerInterval);
            const q = questions[currentIndex];
            const buttons = document.querySelectorAll('.btn-reponse, .img-card');
            buttons.forEach(b => b.disabled = true);

            if (index === q.correctAnswerIndex) {
                element.classList.add('correct');
                score += (timeLeft * 10) + 100;
                updateScore();
            } else {
                element.classList.add('faux');
                if(buttons[q.correctAnswerIndex]) buttons[q.correctAnswerIndex].classList.add('correct');
            }
            setTimeout(nextQuestion, 1500);
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function endGame() {
            document.getElementById('jeu').innerHTML = `
                <div style="text-align:center; margin-top:50px;">
                    <div style="font-size:60px;"></div>
                    <h1 style="color:#ffd24d;">PARTIE TERMINÉE !</h1>
                    <p style="font-size:24px; margin:20px 0;">Score final : <b>${score}</b> points</p>
                    <button class="btn-langue" onclick="location.reload()">Rejouer</button>
                </div>
            `;
        }

        function updateScore() { document.getElementById('score').innerText = score; }
        function updateTimerUI() { 
            document.getElementById('chrono').innerText = timeLeft + 's'; 
            document.getElementById('box-chrono').className = timeLeft <= 10 ? 'box-info chrono-alerte' : 'box-info';
        }
        function updateGadgetsUI() {
            document.getElementById('btn-5050').disabled = !gadgets['5050'];
            document.getElementById('btn-genie').disabled = !gadgets['genie'];
            document.getElementById('btn-temps').disabled = !gadgets['temps'];
        }

        function utiliserGadget(type) {
            if (!gadgets[type]) return;
            const q = questions[currentIndex];
            
            if (type === '5050') {
                const buttons = document.querySelectorAll('.btn-reponse, .img-card');
                let removed = 0;
                buttons.forEach((btn, i) => {
                    if (i !== q.correctAnswerIndex && removed < 2) {
                        btn.style.visibility = 'hidden';
                        removed++;
                    }
                });
            } else if (type === 'genie') {
                alert(`🧞‍♂️ Le Génie pense que la bonne réponse est la numéro ${q.correctAnswerIndex + 1} !`);
            } else if (type === 'temps') {
                timeLeft += 10;
                updateTimerUI();
            }
            gadgets[type] = false;
            updateGadgetsUI();
        }

        init();
    </script>
</body>
</html>
