<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABER AO - Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; text-align: center; margin: 0; padding: 0; }
        .quiz-container { max-width: 600px; margin: 50px auto; padding: 20px; background: #161624; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .topbar { display: flex; justify-content: center; margin-bottom: 20px; }
        .logo { max-height: 60px; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #0f3460; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background: #e94560; }
        #mascote-container { height: 220px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; }
        #mascote { max-height: 100%; transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <!-- En-tête avec votre logo optimisé par Copilot -->
        <div class="topbar">
            <img class="logo" src="assets/mascottes-optimized/00_logo_saber_ao.png" alt="SABER AO Logo">
        </div>

        <!-- Zone d'affichage de la Mascotte Dynamique -->
        <div id="mascote-container">
            <img id="mascote" src="assets/mascottes-optimized/mascotte_bienvenue.png" alt="Mascotte SABER AO">
        </div>

        <div id="question">Carregando pergunta...</div>
        <div id="options"></div>
    </div>

    <script>
        const perguntas = [
            { q: "Qual é a capital de Angola?", o: ["Luanda", "Benguela", "Huambo", "Lubango"], r: 0 },
            { q: "Qual é a moeda oficial de Angola?", o: ["Real", "Dólar", "Kwanza", "Euro"], r: 2 }
        ];
        let indexAtual = 0;
        let pontuacao = 0;

        function carregarPergunta() {
            if(indexAtual < perguntas.length) {
                changerMascotte('a_penser'); // La mascotte réfléchit pendant la question
                document.getElementById('question').innerText = perguntas[indexAtual].q;
                let optionsDiv = document.getElementById('options');
                optionsDiv.innerHTML = '';
                perguntas[indexAtual].o.forEach((opcao, i) => {
                    optionsDiv.innerHTML += `<button class="btn" onclick="verificarResposta(${i})">${opcao}</button>`;
                });
            } else {
                changerMascotte('celebration'); // Célébration finale !
                document.getElementById('question').innerText = `Fim do Jogo! Pontuação: ${pontuacao}/${perguntas.length}`;
                document.getElementById('options').innerHTML = '';
            }
        }

        function verificarResposta(i) {
            if(i === perguntas[indexAtual].r) {
                pontuacao++;
                changerMascotte('bonne_reponse'); // Réaction correcte
            } else {
                changerMascotte('mauvaise_reponse'); // Réaction incorrecte
            }
            indexAtual++;
            setTimeout(carregarPergunta, 2500); // Transition après 2.5 secondes
        }

        // Gestion de la transition fluide (Fade 300ms) avec les chemins de Copilot
        function changerMascotte(estado) {
            const mascoteImg = document.getElementById('mascote');
            mascoteImg.style.opacity = 0;
            setTimeout(() => {
                mascoteImg.src = `assets/mascottes-optimized/mascotte_${estado}.png`;
                mascoteImg.style.opacity = 1;
            }, 300);
        }

        window.onload = carregarPergunta;
    </script>
</body>
</html>
