<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABER AO - Quiz Multilingue</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #071026 0%, #0a1a3a 100%); color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        #accueil { text-align: center; padding: 40px 20px; width: 100%; max-width: 500px; margin-top: 30px; animation: fadeIn 0.8s ease-out; }
        .logo-emoji { font-size: 80px; margin-bottom: 10px; display: inline-block; background: linear-gradient(135deg, #131e36, #1f2d4a); padding: 20px; border-radius: 50%; border: 3px solid #ffd24d; animation: pulse 2s infinite; }
        h1 { color: #ffd24d; font-size: 36px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .subtitle { color: #aaa; margin-bottom: 30px; font-size: 16px; }
        
        .btn-langue { display: block; width: 100%; background: linear-gradient(135deg, #131e36, #1f2d4a); color: white; border: 2px solid #ffd24d; padding: 15px; margin: 8px 0; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s; animation: fadeIn 0.5s ease-out; }
        .btn-langue:hover { background: linear-gradient(135deg, #ffd24d, #ffb700); color: #071026; transform: scale(1.05); box-shadow: 0 5px 15px rgba(255, 210, 77, 0.4); }

        #jeu { display: none; width: 100%; max-width: 600px; padding: 20px; flex-direction: column; flex: 1; animation: fadeIn 0.6s ease-out; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .box-info { background: linear-gradient(135deg, #131e36, #1f2d4a); padding: 12px 18px; border-radius: 12px; border: 2px solid #2a3f5f; text-align: center; min-width: 90px; transition: all 0.3s; }
        .box-info.chrono-alerte { border-color: #dc3545; background: linear-gradient(135deg, #3d1217, #5a1a20); animation: pulse 0.5s infinite; }
        .label { color: #8892b0; font-size: 10px; font-weight: bold; display: block; text-transform: uppercase; }
        .valeur { color: #ffd24d; font-size: 22px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .chrono-alerte .valeur { color: #dc3545; }
        
        .mascotte-container { text-align: center; }
        .mascotte { font-size: 50px; display: inline-block; animation: bounce 2s infinite; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); }
        .mascotte.correct { animation: bounce 0.5s 3; }
        .mascotte.faux { animation: shake 0.5s 2; }
        
        .card-question { background: linear-gradient(135deg, #131e36, #1f2d4a); border-radius: 15px; padding: 25px; margin-bottom: 20px; border-left: 5px solid #ffd24d; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .num-q { color: #8892b0; font-size: 12px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .text-q { font-size: 22px; font-weight: bold; line-height: 1.4; }

        .reponses { display: flex; flex-direction: column; gap: 12px; flex: 1; }
        .btn-reponse { background: linear-gradient(135deg, #131e36, #1f2d4a); color: white; border: 2px solid #2a3f5f; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; animation: fadeIn 0.4s ease-out; }
        .btn-reponse:hover:not(:disabled) { background: linear-gradient(135deg, #1f2d4a, #2a3f5f); transform: translateX(5px); }
        .btn-reponse.correct { background: linear-gradient(135deg, #28a745, #1e7e34); border-color: #1e7e34; animation: pulse 0.5s 2; }
        .btn-reponse.faux { background: linear-gradient(135deg, #dc3545, #bd2130); border-color: #bd2130; animation: shake 0.5s; }
        .btn-reponse:disabled { opacity: 0.7; cursor: not-allowed; }

        .gadgets { display: flex; justify-content: space-around; margin-top: 20px; padding-top: 15px; border-top: 2px solid #131e36; }
        .btn-gadget { background: linear-gradient(135deg, #ffd24d, #ffb700); color: #071026; border: none; padding: 12px 18px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px; transition: all 0.3s; box-shadow: 0 3px 10px rgba(255, 210, 77, 0.3); }
        .btn-gadget:hover:not(:disabled) { transform: scale(1.1); }
        .btn-gadget:disabled { background: linear-gradient(135deg, #333, #555); color: #888; opacity: 0.5; cursor: not-allowed; }

        .grid-images { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .img-card { background: linear-gradient(135deg, #131e36, #1f2d4a); padding: 12px; border-radius: 12px; width: 45%; text-align: center; cursor: pointer; border: 3px solid #2a3f5f; transition: all 0.3s; }
        .img-card:hover:not(.disabled) { transform: scale(1.05); border-color: #ffd24d; }
        .img-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .img-card.correct { border-color: #28a745; background: linear-gradient(135deg, #1a3a2a, #2a5a3a); animation: pulse 0.5s 2; }
        .img-card.faux { border-color: #dc3545; background: linear-gradient(135deg, #3a1a1a, #5a2a2a); animation: shake 0.5s; }

        .feedback { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; font-weight: bold; pointer-events: none; animation: fadeIn 0.3s ease-out, fadeOut 0.5s ease-out 0.7s forwards; z-index: 1000; }
        @keyframes fadeOut { to { opacity: 0; transform: translate(-50%, -50%) scale(2); } }
    </style>
</head>
<body>

    <div id="accueil">
        <div class="logo-emoji">🇴</div>
        <h1>SABER AO</h1>
        <p class="subtitle" id="subtitle-text">Escolha o idioma / Choisissez la langue :</p>
        <div id="liste-langues"></div>
    </div>

    <div id="jeu">
        <div class="top-bar">
            <div class="box-info">
                <span class="label" id="lbl-score">SCORE</span>
                <span class="valeur" id="score">0</span>
            </div>
            <div class="mascotte-container">
                <div class="mascotte" id="mascotte">🦁</div>
            </div>
            <div class="box-info" id="box-chrono">
                <span class="label" id="lbl-chrono">CHRONO</span>
                <span class="valeur" id="chrono">30s</span>
            </div>
        </div>

        <div class="card-question">
            <div class="num-q" id="num-q">Q1/5</div>
            <div class="text-q" id="text-q">Chargement...</div>
        </div>

        <div id="zone-reponses" class="reponses"></div>

        <div class="gadgets">
            <button class="btn-gadget" id="btn-5050" onclick="utiliserGadget('5050')">️ 50/50</button>
            <button class="btn-gadget" id="btn-genie" onclick="utiliserGadget('genie')">🧞‍♂️ Génie</button>
            <button class="btn-gadget" id="btn-temps" onclick="utiliserGadget('temps')">⏸️ +10s</button>
        </div>
    </div>

    <script>
        // --- TRADUCTIONS DE L'INTERFACE ---
        const UI_TEXT = {
            fr: { score: "SCORE", chrono: "CHRONO", genie: "🧞‍♂️ Génie", temps: "⏸️ +10s", endTitle: "PARTIE TERMINÉE !", endScore: "Score final", replay: " Rejouer", excellent: "🌟 Excellent !", good: "👍 Bien joué !", keepGoing: "💪 Continuez !" },
            pt: { score: "PONTOS", chrono: "TEMPO", genie: "🧞‍♂️ Génio", temps: "⏸️ +10s", endTitle: "FIM DE JOGO!", endScore: "Pontuação final", replay: "🔄 Jogar novamente", excellent: "🌟 Excelente !", good: "👍 Bom trabalho !", keepGoing: "💪 Continue !" },
            en: { score: "SCORE", chrono: "TIME", genie: "🧞‍♂️ Genie", temps: "⏸️ +10s", endTitle: "GAME OVER!", endScore: "Final Score", replay: "🔄 Play Again", excellent: "🌟 Excellent !", good: " Good job !", keepGoing: "💪 Keep going !" },
            kg: { score: "NTANGU", chrono: "NTANGU", genie: "🧞‍♂️ Nzimbu", temps: "⏸️ +10s", endTitle: "MASIYA MANA!", endScore: "Ntangu ya nsuka", replay: "🔄 Tubila diaka", excellent: "🌟 Mboti !", good: " Malamu !", keepGoing: "💪 Wila !" },
            ln: { score: "NTANGO", chrono: "NTANGO", genie: "🧞‍♂️ Génie", temps: "⏸️ +10s", endTitle: "MASANA ESILI!", endScore: "Ntango ya nsuka", replay: "🔄 Béta lisusu", excellent: " Malamu mpenza !", good: "👍 Malamu !", keepGoing: " Koba !" },
            kj: { score: "NTANGU", chrono: "NTANGU", genie: "🧞‍♂️ Génio", temps: "⏸️ +10s", endTitle: "MASIYA AMANA!", endScore: "Ntangu ya kupwa", replay: "🔄 Tanga kixi", excellent: "🌟 Kiele !", good: "👍 Kiele !", keepGoing: "💪 Kenda !" },
            umb: { score: "OLUPO", chrono: "OLUPO", genie: "🧞‍♂️ Génio", temps: "⏸️ +10s", endTitle: "OKUPITA!", endScore: "Olupo wokupita", replay: "🔄 Tamba lyi", excellent: "🌟 Walu !", good: "👍 Walu !", keepGoing: "💪 Kala !" }
        };

        // --- QUESTIONS PAR LANGUE ---
        const QUESTIONS_LOCALES = {
            fr: [
                { type: 'text', text: "Quelle est la capitale de l'Angola ?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 },
                { type: 'text', text: "Quelle est la monnaie officielle d'Angola ?", answers: ["Kwanza", "Franc", "Real", "Dollar"], correctAnswerIndex: 0 },
                { type: 'image', text: "Quel est le drapeau officiel de l'Angola ?", answers: ["https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Flag_of_Angola.svg/320px-Flag_of_Angola.svg.png", "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Flag_of_Zambia.svg/320px-Flag_of_Zambia.svg.png"], correctAnswerIndex: 0 },
                { type: 'text', text: "En quelle année l'Angola est-il devenu indépendant ?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 },
                { type: 'text', text: "Quel style musical moderne est originaire d'Angola ?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }
            ],
            pt: [
                { type: 'text', text: "Qual é a capital de Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 },
                { type: 'text', text: "Qual é a moeda oficial de Angola?", answers: ["Kwanza", "Franco", "Real", "Dólar"], correctAnswerIndex: 0 },
                { type: 'image', text: "Qual é a bandeira oficial de Angola?", answers: ["https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Flag_of_Angola.svg/320px-Flag_of_Angola.svg.png", "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Flag_of_Zambia.svg/320px-Flag_of_Zambia.svg.png"], correctAnswerIndex: 0 },
                { type: 'text', text: "Em que ano Angola tornou-se independente?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 },
                { type: 'text', text: "Qual estilo musical é originário de Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }
            ],
            en: [
                { type: 'text', text: "What is the capital of Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 },
                { type: 'text', text: "What is the official currency of Angola?", answers: ["Kwanza", "Franc", "Real", "Dollar"], correctAnswerIndex: 0 },
                { type: 'image', text: "Which is the official flag of Angola?", answers: ["https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Flag_of_Angola.svg/320px-Flag_of_Angola.svg.png", "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Flag_of_Zambia.svg/320px-Flag_of_Zambia.svg.png"], correctAnswerIndex: 0 },
                { type: 'text', text: "In which year did Angola gain independence?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 },
                { type: 'text', text: "Which music genre originates from Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }
            ],
            kg: [
                { type: 'text', text: "Nki i mbanza ya ntotila ya Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 },
                { type: 'text', text: "Nki i nzimbu ya nsi ya Angola?", answers: ["Kwanza", "Franc", "Real", "Dollar"], correctAnswerIndex: 0 },
                { type: 'image', text: "Nki i dimbu (bandeira) ya Angola?", answers: ["https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Flag_of_Angola.svg/320px-Flag_of_Angola.svg.png", "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Flag_of_Zambia.svg/320px-Flag_of_Zambia.svg.png"], correctAnswerIndex: 0 },
                { type: 'text', text: "Nki mvu Angola banzikisa kimpwanza?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 },
                { type: 'text', text: "Nki mutindu ya miziki ukatuka mu Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }
            ],
            ln: [
                { type: 'text', text: "Mbonge nini ezali engumba bokonzi ya Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 },
                { type: 'text', text: "Mbongo nini esalelamaka na Angola?", answers: ["Kwanza", "Franc", "Real", "Dollar"], correctAnswerIndex: 0 },
                { type: 'image', text: "Drapeau nini ezali ya mboka Angola?", answers: ["https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Flag_of_Angola.svg/320px-Flag_of_Angola.svg.png", "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Flag_of_Zambia.svg/320px-Flag_of_Zambia.svg.png"], correctAnswerIndex: 0 },
                { type: 'text', text: "Mobu nini Angola ezwaki lipanda?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 },
                { type: 'text', text: "Miziki nini eutaki na mboka Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }
            ],
            kj: [
                { type: 'text', text: "Ihi i mbanza ia mbota ia Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 },
                { type: 'text', text: "Ihi i kitadi kia nsi ia Angola?", answers: ["Kwanza", "Franco", "Real", "Dólar"], correctAnswerIndex: 0 },
                { type: 'image', text: "Ihi i ndemba (bandeira) ia Angola?", answers: ["https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Flag_of_Angola.svg/320px-Flag_of_Angola.svg.png", "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Flag_of_Zambia.svg/320px-Flag_of_Zambia.svg.png"], correctAnswerIndex: 0 },
                { type: 'text', text: "Mu muvu uhi Angola iatambula utuminu?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 },
                { type: 'text', text: "Muzika uhi utunda mu Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }
            ],
            umb: [
                { type: 'text', text: "Helie ofekalupale yo Angola?", answers: ["Luanda", "Benguela", "Huambo", "Lubango"], correctAnswerIndex: 0 },
                { type: 'text', text: "Orombongo ipi vielinga vokalunga ko Angola?", answers: ["Kwanza", "Franco", "Real", "Dólar"], correctAnswerIndex: 0 },
                { type: 'image', text: "Oependelo lipi lyo Angola?", answers: ["https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Flag_of_Angola.svg/320px-Flag_of_Angola.svg.png", "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Flag_of_Zambia.svg/320px-Flag_of_Zambia.svg.png"], correctAnswerIndex: 0 },
                { type: 'text', text: "Ulimbo upi Angola viawile elianjo?", answers: ["1975", "1960", "1990", "2002"], correctAnswerIndex: 0 },
                { type: 'text', text: "Owisikihulo upi utunda ko Angola?", answers: ["Kizomba", "Samba", "Reggae", "Salsa"], correctAnswerIndex: 0 }
            ]
        };

        // --- ÉTAT DU JEU ---
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval;
        let gadgets = { '5050': true, 'genie': true, 'temps': true };
        let currentLang = 'fr';

        // --- SON ---
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        function jouerSon(type) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            if (type === 'correct') {
                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1);
                oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } else if (type === 'faux') {
                oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioContext.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            }
        }

        // --- INITIALISATION ---
        function init() {
            const liste = document.getElementById('liste-langues');
            const langues = [
                { code: 'fr', label: '🇷 Français' }, { code: 'pt', label: '🇵 Português' },
                { code: 'en', label: '🇬🇧 English' }, { code: 'kg', label: '🇬 Kikongo' },
                { code: 'ln', label: '🇨 Lingála' }, { code: 'kj', label: '🇦🇴 Kimbundu' },
                { code: 'umb', label: '🇦🇴 Umbundu' }
            ];
            langues.forEach((lang, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-langue';
                btn.innerText = lang.label;
                btn.style.animationDelay = `${index * 0.1}s`;
                btn.onclick = () => startGame(lang.code);
                liste.appendChild(btn);
            });
        }

        function startGame(lang) {
            currentLang = lang;
            document.getElementById('accueil').style.display = 'none';
            document.getElementById('jeu').style.display = 'flex';
            
            // Appliquer les traductions de l'interface
            const t = UI_TEXT[lang] || UI_TEXT['fr'];
            document.getElementById('lbl-score').innerText = t.score;
            document.getElementById('lbl-chrono').innerText = t.chrono;
            document.getElementById('btn-genie').innerText = t.genie;
            document.getElementById('btn-temps').innerText = t.temps;
            
            score = 0;
            currentIndex = 0;
            gadgets = { '5050': true, 'genie': true, 'temps': true };
            updateGadgetsUI();
            updateScore();

            questions = QUESTIONS_LOCALES[lang] || QUESTIONS_LOCALES['pt'];
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= questions.length) {
                endGame();
                return;
            }
            const q = questions[currentIndex];
            document.getElementById('num-q').innerText = `Q${currentIndex + 1}/${questions.length}`;
            document.getElementById('text-q').innerText = q.text;
            
            const zone = document.getElementById('zone-reponses');
            zone.innerHTML = '';
            zone.className = 'reponses';

            if (q.type === 'image') {
                zone.className = 'grid-images';
                q.answers.forEach((url, i) => {
                    const div = document.createElement('div');
                    div.className = 'img-card';
                    div.innerHTML = `<img src="${url}" alt="Option ${i+1}"><div style="color:#ffd24d; margin-top:8px; font-weight:bold; font-size:14px;">Option ${String.fromCharCode(65+i)}</div>`;
                    div.onclick = () => checkAnswer(i, div);
                    zone.appendChild(div);
                });
            } else {
                q.answers.forEach((ans, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-reponse';
                    btn.innerText = ans;
                    btn.onclick = () => checkAnswer(i, btn);
                    zone.appendChild(btn);
                });
            }
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            updateTimerUI();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    afficherFeedback('⏱️', 'faux');
                    jouerSon('faux');
                    setTimeout(nextQuestion, 1000);
                }
            }, 1000);
        }

        function checkAnswer(index, element) {
            clearInterval(timerInterval);
            const q = questions[currentIndex];
            const buttons = document.querySelectorAll('.btn-reponse, .img-card');
            buttons.forEach(b => b.disabled = true);

            if (index === q.correctAnswerIndex) {
                element.classList.add('correct');
                score += (timeLeft * 10) + 100;
                updateScore();
                afficherFeedback('✅', 'correct');
                jouerSon('correct');
                document.getElementById('mascotte').classList.add('correct');
                setTimeout(() => document.getElementById('mascotte').classList.remove('correct'), 1500);
            } else {
                element.classList.add('faux');
                if(buttons[q.correctAnswerIndex]) buttons[q.correctAnswerIndex].classList.add('correct');
                afficherFeedback('❌', 'faux');
                jouerSon('faux');
                document.getElementById('mascotte').classList.add('faux');
                setTimeout(() => document.getElementById('mascotte').classList.remove('faux'), 1000);
            }
            setTimeout(nextQuestion, 2000);
        }

        function afficherFeedback(emoji, type) {
            const feedback = document.createElement('div');
            feedback.className = `feedback ${type}`;
            feedback.innerText = emoji;
            document.body.appendChild(feedback);
            setTimeout(() => feedback.remove(), 1200);
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function endGame() {
            const t = UI_TEXT[currentLang] || UI_TEXT['fr'];
            let message = t.keepGoing;
            if (score >= 400) message = t.excellent;
            else if (score >= 200) message = t.good;

            document.getElementById('jeu').innerHTML = `
                <div style="text-align:center; margin-top:50px; animation: fadeIn 0.8s ease-out;">
                    <div style="font-size:80px; animation: bounce 1s infinite;">🏆</div>
                    <h1 style="color:#ffd24d; margin:20px 0; font-size:32px;">${t.endTitle}</h1>
                    <p style="font-size:28px; margin:20px 0; color:#fff;">${t.endScore} : <b style="color:#ffd24d; font-size:36px;">${score}</b></p>
                    <p style="font-size:18px; color:#aaa; margin-bottom:30px;">${message}</p>
                    <button class="btn-langue" onclick="location.reload()" style="max-width:300px; margin:0 auto;">${t.replay}</button>
                </div>
            `;
            jouerSon('correct');
        }

        function updateScore() { document.getElementById('score').innerText = score; }
        function updateTimerUI() { 
            document.getElementById('chrono').innerText = timeLeft + 's'; 
            document.getElementById('box-chrono').className = timeLeft <= 10 ? 'box-info chrono-alerte' : 'box-info';
        }
        function updateGadgetsUI() {
            document.getElementById('btn-5050').disabled = !gadgets['5050'];
            document.getElementById('btn-genie').disabled = !gadgets['genie'];
            document.getElementById('btn-temps').disabled = !gadgets['temps'];
        }

        function utiliserGadget(type) {
            if (!gadgets[type]) return;
            const q = questions[currentIndex];
            if (type === '5050') {
                const buttons = document.querySelectorAll('.btn-reponse, .img-card');
                let removed = 0;
                buttons.forEach((btn, i) => {
                    if (i !== q.correctAnswerIndex && removed < 2) {
                        btn.style.visibility = 'hidden';
                        removed++;
                    }
                });
            } else if (type === 'genie') {
                alert(`🧞‍♂️ ${UI_TEXT[currentLang].genie}: ${q.correctAnswerIndex + 1}`);
            } else if (type === 'temps') {
                timeLeft += 10;
                updateTimerUI();
            }
            gadgets[type] = false;
            updateGadgetsUI();
            jouerSon('correct');
        }

        init();
    </script>
</body>
</html>
