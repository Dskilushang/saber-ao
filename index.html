<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SABER AO — Quiz de Cultura Geral</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 0%,#0e1c3f 0%,#071026 55%,#02060f 100%);color:#fff;min-height:100vh;overflow-x:hidden}
.spot{position:fixed;inset:-60%;background:conic-gradient(from 0deg,transparent 0 7%,rgba(255,210,77,.06) 9%,transparent 12% 45%,rgba(255,210,77,.05) 47%,transparent 50%);animation:tourne 16s linear infinite;pointer-events:none;z-index:0}
@keyframes tourne{to{transform:rotate(360deg)}}
.screen{display:none;position:relative;z-index:2;max-width:520px;margin:0 auto;padding:18px 14px 28px;min-height:100vh}
.screen.active{display:block;animation:zoom .35s ease}
@keyframes zoom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* SPLASH */
#screen-splash{text-align:center}
#screen-splash.active{display:flex;flex-direction:column;justify-content:center}
.halo{width:120px;height:120px;margin:50px auto 12px;border-radius:50%;border:3px solid #ffd24d;background:radial-gradient(circle at 32% 28%,#233559,#0d1526);display:flex;align-items:center;justify-content:center;font-size:52px;animation:halo 2.4s infinite;box-shadow:0 0 45px rgba(255,210,77,.45)}
@keyframes halo{0%,100%{box-shadow:0 0 22px rgba(255,210,77,.3)}50%{box-shadow:0 0 60px rgba(255,210,77,.65)}}
.titre-splash{font-size:36px;color:#ffd24d;letter-spacing:5px;text-shadow:0 0 20px rgba(255,210,77,.7);animation:glow 2s infinite alternate}
@keyframes glow{from{text-shadow:0 0 8px rgba(255,210,77,.4)}to{text-shadow:0 0 28px rgba(255,210,77,.95)}}
.sous-splash{color:#8fa3c8;font-size:12px;margin:8px 0 24px;letter-spacing:2px}
.btn-start{background:linear-gradient(135deg,#ffd24d,#ff9d1c);border:none;color:#1a1200;font-weight:bold;font-size:16px;padding:14px 40px;border-radius:30px;cursor:pointer;box-shadow:0 0 25px rgba(255,180,40,.5);animation:respir 1.8s infinite}
@keyframes respir{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ACCUEIL */
h1.titre{text-align:center;color:#ffd24d;font-size:28px;letter-spacing:3px}
.sous-titre{text-align:center;color:#9fb0c9;font-size:11.5px;margin:5px 0 16px}
.logo-accueil{width:88px;height:88px;margin:12px auto 2px;border-radius:50%;border:3px solid #ffd24d;background:radial-gradient(circle at 32% 28%,#233559,#0d1526);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;animation:halo 3s infinite}
.logo-accueil img{width:80%;height:80%;object-fit:contain;z-index:2}
.logo-accueil .fb{position:absolute;font-size:42px}
.btn-langue{display:block;width:100%;background:linear-gradient(135deg,#131e36,#1b2a4c);border:1px solid #ffd24d;color:#fff;font-size:15.5px;font-weight:bold;padding:12px;border-radius:14px;margin:7px 0;cursor:pointer;transition:.2s}
.btn-langue:active{transform:scale(.96)}

/* PLATEAU */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:12px}
.box{background:rgba(13,22,44,.95);border:1px solid #ffd24d55;border-radius:12px;padding:7px 10px;text-align:center;min-width:74px}
.box .label{font-size:9px;color:#8892b0;font-weight:bold;letter-spacing:1px}
.box .val{font-size:19px;font-weight:bold}
#val-score{color:#ffd24d}#val-chrono{color:#00f2fe}
.box.alerte{border-color:#dc3545;background:#3d1217}
.box.alerte .val{color:#ff6b6b;animation:blink .5s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.4}}

/* NIVEAUX & MOTIVATION */
.palier{text-align:center;margin-bottom:10px}
.palier .badge-niveau{display:inline-block;background:linear-gradient(135deg,#ffd24d33,#ffd24d11);border:1px solid #ffd24d66;color:#ffd24d;font-weight:bold;font-size:13px;padding:5px 18px;border-radius:20px;letter-spacing:1px}

/* QUESTION */
.card-q{position:relative;background:linear-gradient(180deg,#16223f,#0d1830);border:2px solid #ffd24d;border-radius:16px;padding:18px 16px;margin-bottom:14px;box-shadow:0 0 30px rgba(255,210,77,.28),inset 0 0 30px rgba(255,210,77,.06);animation:haloQ 3s infinite}
@keyframes haloQ{0%,100%{box-shadow:0 0 18px rgba(255,210,77,.2),inset 0 0 24px rgba(255,210,77,.05)}50%{box-shadow:0 0 42px rgba(255,210,77,.45),inset 0 0 34px rgba(255,210,77,.1)}}
.num-q{color:#8892b0;font-size:10.5px;font-weight:bold;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.txt-q{font-size:16.5px;font-weight:bold;text-align:center;line-height:1.5}
.btn-voix{background:none;border:1px solid #2a3c66;color:#00f2fe;border-radius:8px;font-size:10px;padding:2px 8px;cursor:pointer}

/* RÉPONSES */
.grid-rep{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rep{position:relative;background:linear-gradient(180deg,#131e36,#0f1830);border:1px solid #2a3c66;color:#fff;font-size:13.5px;font-weight:600;padding:13px 10px 13px 34px;border-radius:6px;cursor:pointer;transition:.15s;text-align:left;min-height:58px;animation:monter .4s ease backwards}
.rep:nth-child(1){animation-delay:.05s}.rep:nth-child(2){animation-delay:.12s}.rep:nth-child(3){animation-delay:.19s}.rep:nth-child(4){animation-delay:.26s}
@keyframes monter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rep::before{content:"◆ " attr(data-l);position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#ffd24d;font-weight:bold;font-size:14px}
.rep:active{background:#22345e;border-color:#ffd24d}
.rep.bonne{background:#1d7a35;border-color:#7dff9e;box-shadow:0 0 22px rgba(40,200,90,.6);animation:pulseB .5s ease 2}
@keyframes pulseB{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.rep.faute{background:#8f1f2c;border-color:#ff8a9b;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.rep.desactive{opacity:.13;pointer-events:none}
.rep img{display:block;width:100%;height:86px;object-fit:cover;border-radius:6px;background:#1e2d4a;margin-top:6px}
.rep.imgmode{padding:10px 10px 8px 34px;min-height:150px}
.grid-img{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-img .rep{animation:none}

/* MASCOTTE ANIMÉE */
.mascotte{text-align:center;cursor:pointer;position:relative;width:70px;height:70px}
.mascotte .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px}
.mascotte img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;filter:drop-shadow(0 0 6px rgba(255,210,77,.4))}
.mascotte .emo-img{display:inline-block;animation:flotte 2.4s infinite}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mascotte small{position:absolute;bottom:-11px;left:0;right:0;color:#ffd24d;font-size:7.5px;font-weight:bold;letter-spacing:1px}
.mascotte.content img,.mascotte.content .emo-img{animation:danse .45s ease-in-out 3!important}
@keyframes danse{0%,100%{transform:rotate(-14deg) scale(1.15)}50%{transform:rotate(14deg) scale(1.28)}}
.mascotte.triste img,.mascotte.triste .emo-img{animation:tremble .3s ease-in-out 3!important}
@keyframes tremble{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* GADGETS */
.gadgets{display:flex;justify-content:space-around;margin-top:14px;padding-top:12px;border-top:1px solid rgba(42,60,102,.6)}
.gadget{background:linear-gradient(135deg,#ffd24d,#ff9d1c);color:#1a1200;font-weight:bold;border:none;font-size:12px;padding:9px 14px;border-radius:22px;cursor:pointer;box-shadow:0 3px 12px rgba(255,180,40,.35);transition:.15s}
.gadget:active{transform:scale(.9)}
.gadget:disabled{background:#2a2f3a;color:#666;opacity:.5;box-shadow:none}

/* DIVERS */
.confetti{position:fixed;top:-12px;width:10px;height:10px;z-index:99;animation:chute linear forwards}
@keyframes chute{to{transform:translateY(105vh) rotate(680deg)}}
.chargement{text-align:center;padding-top:100px}
.spinner{font-size:56px;display:inline-block;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fin{text-align:center;padding-top:70px}
.trophy{font-size:64px;animation:flotte 1.6s infinite}
.btn-jaune{background:linear-gradient(135deg,#ffd24d,#ff9d1c);color:#1a1200;font-weight:bold;border:none;padding:13px 30px;border-radius:26px;font-size:15px;margin-top:16px;cursor:pointer;box-shadow:0 0 20px rgba(255,180,40,.45)}
</style>
</head>
<body>
<div class="spot"></div>

<div id="screen-splash" class="screen active">
  <div class="halo">🦁</div>
  <div class="titre-splash">SABER AO</div>
  <div class="sous-splash">✦ JOGO DE CULTURA GERAL DE ANGOLA ✦</div>
  <button class="btn-start" onclick="entrerStudio()">▶ ENTRER DANS LE STUDIO</button>
</div>

<div id="screen-home" class="screen">
  <div class="logo-accueil"><span class="fb">🇦🇴</span><img src="https://raw.githubusercontent.com/Dskilushang/saber-ao/feature/optimize-logo/assets/mascottes-optimized/00_logo_saber_ao.png" onerror="this.style.display='none'"></div>

</div>

<div id="screen-game" class="screen">
  <div class="topbar">
    <div class="box"><div class="label">POINTS</div><div class="val" id="val-score">0</div></div>
    <div class="mascotte" id="mascotte" onclick="parler()"><div class="fb"><span class="emo-img" id="masc-fb">🦁</span></div><img id="masc-img" src="https://raw.githubusercontent.com/Dskilushang/saber-ao/feature/optimize-logo/assets/mascottes-optimized/mascotte_pergunta.png" onerror="this.style.display='none'"><small>SABER AO</small></div>
    <div class="box" id="box-chrono"><div class="label">CHRONO</div><div class="val" id="val-chrono">30s</div></div>
  </div>
  <div class="palier"><span class="badge-niveau" id="badge-niveau">Niveau 1 🥉 Débutant</span></div>
  <div class="card-q"><div class="num-q"><span id="num-q"></span><button class="btn-voix" id="btn-voix" onclick="toggleVoix()">🗣️ ON</button></div><div class="txt-q" id="txt-q"></div></div>
  <div id="zone-rep"></div>
  <div class="gadgets">
    <button class="gadget" id="g-fifty" onclick="gadget('fifty')">50/50</button>
    <button class="gadget" id="g-genie" onclick="gadget('genie')">🧞‍♂️ Génie</button>
    <button class="gadget" id="g-temps" onclick="gadget('temps')">⏸️ +10s</button>
  </div>
</div>

<div id="screen-end" class="screen">
  <div class="fin"><div class="trophy">🏆</div>
  <h2 style="color:#ffd24d;margin:12px 0 6px">Parabéns !</h2>
  <p style="font-size:17px">Score final : <b id="score-final" style="color:#ffd24d">0</b> points</p>
  <p style="font-size:14px;color:#ffd24d;margin-top:8px" id="titre-obtenu"></p>
  <button class="btn-jaune" onclick="retourAccueil()">🔄 NOVA PARTIDA</button></div>
</div>

<script>
const API="https://saber-ao-backend.onrender.com/api/questions";
const GH="https://raw.githubusercontent.com/Dskilushang/saber-ao/feature/optimize-logo/assets/mascottes-optimized/";
const M_PERQ=GH+"mascotte_pergunta.png",M_PENSE=GH+"mascotte_a_penser.png";
const FLAG_AO="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Flag_of_Angola.svg/320px-Flag_of_Angola.svg.png";
const FLAG_ZM="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Flag_of_Zambia.svg/320px-Flag_of_Zambia.svg.png";

/* MOTIVATION PAR NIVEAUX (Rien à voir avec l'argent) */
const NIVEAUX=[
  "Niveau 1 🥉 Débutant",
  "Niveau 2 🥈 Apprenti",
  "Niveau 3 🥇 Connaisseur",
  "Niveau 4 🌟 Expert",
  "Niveau 5 💎 Maître",
  "Niveau 6 👑 Grand Maître",
  "Niveau 7 🇦🇴 Légende de Sabiduria"
];

/* 4 LANGUES CONSERVÉES */
const LANGUES=[
  {code:"fr",label:"🇫🇷 Français"},
  {code:"pt",label:"🇦🇴 Português"},
  {code:"en",label:"🇬🇧 English"},
  {code:"ln",label:"🗣️ Lingála"}
];

/* BANQUES DE BASE */
const Q={
fr:[{text:"Quelle est la capitale de l'Angola ?",rep:["Luanda","Benguela","Huambo","Lubango"],ok:0},{text:"Quelle est la monnaie officielle de l'Angola ?",rep:["Kwanza","Franc CFA","Real","Dollar"],ok:0},{text:"Quel est le drapeau officiel de l'Angola ?",rep:[FLAG_AO,FLAG_ZM],ok:0,img:true},{text:"En quelle année l'Angola est-il devenu indépendant ?",rep:["1975","1885","1990","2002"],ok:0},{text:"Quel genre musical est né en Angola ?",rep:["La kizomba","La salsa","Le reggae","Le tango"],ok:0},{text:"Quelle est la langue officielle de l'Angola ?",rep:["Le portugais","Le français","L'espagnol","L'anglais"],ok:0},{text:"Quel océan borde l'Angola ?",rep:["L'Atlantique","L'Indien","Le Pacifique","L'Arctique"],ok:0},{text:"Qui fut le premier président de l'Angola ?",rep:["Agostinho Neto","J.E. dos Santos","Holden Roberto","Lopo do Nascimento"],ok:0},{text:"Quelle est la 2ème plus grande ville d'Angola ?",rep:["Huambo","Lobito","Malanje","Cabinda"],ok:0},{text:"Sur le drapeau, on voit une machette, une étoile et…",rep:["Une roue dentée","Un soleil","Une couronne","Un livre"],ok:0},{text:"Quel pays NE borde PAS l'Angola ?",rep:["Le Mozambique","La RD Congo","La Zambie","Le Congo-Brazza"],ok:0},{text:"Quel animal emblématique vit au parc Kissama ?",rep:["Le palanca negra géant","Le lion blanc","L'éléphant pygmée","Le gorille"],ok:0},{text:"Combien de provinces compte l'Angola ?",rep:["18","14","21","9"],ok:0},{text:"Quelle province est une exclave ?",rep:["Cabinda","Benguela","Namibe","Moxico"],ok:0}],
pt:[{text:"Qual é a capital de Angola?",rep:["Luanda","Benguela","Huambo","Lubango"],ok:0},{text:"Qual é a moeda oficial de Angola?",rep:["Kwanza","Franco","Real","Dólar"],ok:0},{text:"Qual é a bandeira oficial de Angola?",rep:[FLAG_AO,FLAG_ZM],ok:0,img:true},{text:"Em que ano Angola tornou-se independente?",rep:["1975","1885","1990","2002"],ok:0},{text:"Qual estilo musical nasceu em Angola?",rep:["Kizomba","Salsa","Reggae","Tango"],ok:0},{text:"Qual é a língua oficial de Angola?",rep:["Português","Francês","Espanhol","Inglês"],ok:0},{text:"Que oceano banha Angola?",rep:["Atlântico","Índico","Pacífico","Ártico"],ok:0},{text:"Quem foi o primeiro presidente de Angola?",rep:["Agostinho Neto","J.E. dos Santos","Holden Roberto","Lopo do Nascimento"],ok:0},{text:"Qual é a 2ª maior cidade de Angola?",rep:["Huambo","Lobito","Malanje","Cabinda"],ok:0},{text:"Na bandeira vê-se uma catana, uma estrela e…",rep:["Uma roda dentada","Um sol","Uma coroa","Um livro"],ok:0},{text:"Que país NÃO faz fronteira com Angola?",rep:["Moçambique","RD Congo","Zâmbia","Congo-Brazza"],ok:0},{text:"Que animal vive no parque da Kissama?",rep:["Palanca negra gigante","Leão branco","Elefante pigmeu","Gorila"],ok:0},{text:"Quantas províncias tem Angola?",rep:["18","14","21","9"],ok:0},{text:"Que província é um exclave?",rep:["Cabinda","Benguela","Namibe","Moxico"],ok:0}],
en:[{text:"What is the capital of Angola?",rep:["Luanda","Benguela","Huambo","Lubango"],ok:0},{text:"What is the official currency of Angola?",rep:["Kwanza","Franc","Real","Dollar"],ok:0},{text:"Which is the official flag of Angola?",rep:[FLAG_AO,FLAG_ZM],ok:0,img:true},{text:"In which year did Angola gain independence?",rep:["1975","1885","1990","2002"],ok:0},{text:"Which music genre was born in Angola?",rep:["Kizomba","Salsa","Reggae","Tango"],ok:0},{text:"What is the official language of Angola?",rep:["Portuguese","French","Spanish","English"],ok:0},{text:"Which ocean borders Angola?",rep:["Atlantic","Indian","Pacific","Arctic"],ok:0},{text:"Who was Angola's first president?",rep:["Agostinho Neto","J.E. dos Santos","Holden Roberto","Lopo do Nascimento"],ok:0},{text:"What is Angola's 2nd largest city?",rep:["Huambo","Lobito","Malanje","Cabinda"],ok:0},{text:"On the flag you see a machete, a star and…",rep:["A cog wheel","A sun","A crown","A book"],ok:0},{text:"Which country does NOT border Angola?",rep:["Mozambique","DR Congo","Zambia","Congo-Brazza"],ok:0},{text:"Which iconic animal lives in Kissama park?",rep:["Giant black sable","White lion","Pygmy elephant","Gorilla"],ok:0},{text:"How many provinces does Angola have?",rep:["18","14","21","9"],ok:0},{text:"Which province is an exclave?",rep:["Cabinda","Benguela","Namibe","Moxico"],ok:0}],
ln:[{text:"Mbonge nini ezali engumba bokonzi ya Angola?",rep:["Luanda","Benguela","Huambo","Lubango"],ok:0},{text:"Mbongo nini esalelamaka na Angola?",rep:["Kwanza","Franc","Real","Dollar"],ok:0},{text:"Drapeau nini ezali ya Angola?",rep:[FLAG_AO,FLAG_ZM],ok:0,img:true},{text:"Mobu nini Angola ezwaki lipanda?",rep:["1975","1885","1990","2002"],ok:0},{text:"Miziki nini eutaki na Angola?",rep:["Kizomba","Salsa","Reggae","Tango"],ok:0},{text:"Lokota ya mboka Angola ezali nini?",rep:["Português","Français","Anglais"],ok:0},{text:"Nani azalaki président ya liboso?",rep:["Agostinho Neto","J.E. dos Santos","Unita"],ok:0},{text:"Ekolo ya Angola ezali na bituka boni?",rep:["18","14","21"],ok:0}]
};

let langue=null,questions=[],idx=0,score=0,chrono=30,timer=null,verrou=false,voix=true;
let dispo={fifty:true,genie:true,temps:true};

/* BANQUE AUTO-CROISSANTE EN MÉMOIRE (localStorage) */
function cleBanque(code){return "saber_banque_"+code;}
function lireBanque(code){try{return JSON.parse(localStorage.getItem(cleBanque(code)))||[]}catch(e){return[]}}
function ajouterBanque(code,qs){
try{
let b=lireBanque(code);let ajout=0;
qs.forEach(q=>{
if(!q.text||!Array.isArray(q.answers)||q.answers.length<2)return;
const dup=b.some(x=>x.text.toLowerCase()===q.text.toLowerCase());
if(!dup&&b.length<500){b.push({text:q.text,rep:q.answers,ok:q.correctAnswerIndex,img:q.type==="image"});ajout++;}});
if(ajout)localStorage.setItem(cleBanque(code),JSON.stringify(b));
}catch(e){}}

/* AUDIO STUDIO */
let AC=null,ambOsc=null,ambTimer=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC;}
function note(f,at,dur,type,g){try{const c=ac(),o=c.createOscillator(),v=c.createGain();o.type=type||"sine";o.frequency.value=f;const t=c.currentTime+at;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g||.12,t+.02);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+dur+.05);}catch(e){}}
function generique(){[[110,0,.5,"sawtooth",.07],[220,.1,.4],[165,.45,.4],[220,.8,.4],[261.6,1.15,.4],[329.6,1.5,.4],[440,1.85,.45],[659,2.2,.9,"sine",.14],[87,2.2,1.1,"sawtooth",.06]].forEach(n=>note(n[0],n[1],n[2],n[3],n[4]));}
function startAmbiance(){stopAmbiance();try{const c=ac();const g=c.createGain();g.gain.value=.045;g.connect(c.destination);ambOsc=c.createOscillator();ambOsc.type="triangle";ambOsc.frequency.value=55;ambOsc.connect(g);ambOsc.start();const pat=[55,55,65.4,82.4];let i=0;ambTimer=setInterval(()=>{ambOsc.frequency.setValueAtTime(pat[i%4],c.currentTime);i++;},480);}catch(e){}}
function stopAmbiance(){if(ambTimer){clearInterval(ambTimer);ambTimer=null;}if(ambOsc){try{ambOsc.stop()}catch(e){}ambOsc=null;}}
function fanfare(){[[523,0],[659,.09],[784,.18],[1046,.27],[1318,.45]].forEach(n=>note(n[0],n[1],.4,"triangle",.14));note(392,.45,.6,"triangle",.08);}
function buzzer(){[[130,0,.35],[98,.25,.5],[65,.5,.8]].forEach(n=>note(n[0],n[1],n[2],"sawtooth",.16));}
function tick(){note(chrono<=5?1100:900,0,.06,"square",.05);}
function clic(){note(700,0,.08,"sine",.08);}
function vibrer(m){try{navigator.vibrate&&navigator.vibrate(m)}catch(e){}}

/* VOIX OFF */
function dire(txt){if(!voix)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);const map={fr:"fr-FR",pt:"pt-PT",en:"en-US"};u.lang=(langue&&map[langue.code])||"fr-FR";u.rate=1;speechSynthesis.speak(u);}catch(e){}}
function toggleVoix(){voix=!voix;document.getElementById("btn-voix").textContent="🗣️ "+(voix?"ON":"OFF");if(!voix)try{speechSynthesis.cancel()}catch(e){}}

/* DÉCOR */
for(let i=0;i<30;i++){const s=document.createElement("div");s.className="etoile";const t=Math.random()*3+1;
s.style.cssText="position:fixed;border-radius:50%;background:#fff;pointer-events:none;z-index:0;animation:blink 3s infinite;width:"+t+"px;height:"+t+"px;left:"+Math.random()*100+"vw;top:"+Math.random()*100+"vh;animation-delay:"+Math.random()*3+"s;opacity:.5";document.body.appendChild(s);}
function confetti(){const col=["#ffd24d","#ff6b6b","#4dabf7","#69db7c","#e599f7"];
for(let i=0;i<30;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=col[Math.floor(Math.random()*col.length)];c.style.animationDuration=(2+Math.random()*1.5)+"s";c.style.borderRadius=Math.random()>.5?"50%":"2px";document.body.appendChild(c);setTimeout(()=>c.remove(),3800);}}
function ecran(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");}
function melange(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function prepare(banque){return melange(banque.slice()).slice(0,NIVEAUX.length).map(q=>{const idxs=melange(q.rep.map((_,i)=>i));return{text:q.text,rep:idxs.map(i=>q.rep[i]),ok:idxs.indexOf(q.ok),img:q.img};});}

/* DÉROULEMENT */
function entrerStudio(){ac();generique();setTimeout(afficherAccueil,2600);}
function afficherAccueil(){stopAmbiance();
const z=document.getElementById("liste-langues");z.innerHTML="";
LANGUES.forEach(l=>{const b=document.createElement("button");b.className="btn-langue";b.textContent=l.label;b.onclick=()=>{clic();jouer(l);};z.appendChild(b);});
ecran("screen-home");}

async function jouer(l){
langue=l;score=0;idx=0;chrono=30;verrou=false;
dispo={fifty:true,genie:true,temps:true};majGadgets();
document.getElementById("val-score").textContent="0";
ecran("screen-load");
questions=await charger(l.code);
ecran("screen-game");startAmbiance();afficherQuestion();}

async function charger(code){
if(code==="fr"||code==="pt"||code==="en"){
try{const c=new AbortController();const t=setTimeout(()=>c.abort(),3500);
const r=await fetch(API+"?lang="+code,{signal:c.signal});clearTimeout(t);
const d=await r.json();
if(Array.isArray(d)&&d.length>2){
ajouterBanque(code,d);
return d.map(q=>({text:q.text,rep:q.answers,ok:q.correctAnswerIndex,img:q.type==="image"}));}}catch(e){}}
return prepare((Q[code]||[]).concat(lireBanque(code)));}

function mascEtat(mode){const m=document.getElementById("mascotte");m.className="mascotte "+mode;
document.getElementById("masc-img").style.display="";document.getElementById("masc-img").src=mode==="triste"?M_PENSE:M_PERQ;}

function afficherQuestion(){
verrou=false;chrono=30;majChrono();mascEtat("");
const q=questions[idx];
document.getElementById("num-q").textContent="Question "+(idx+1)+"/"+questions.length;
document.getElementById("txt-q").textContent=q.text;
document.getElementById("badge-niveau").textContent=NIVEAUX[idx]||NIVEAUX[NIVEAUX.length-1];
dire(q.text);
const z=document.getElementById("zone-rep");z.innerHTML="";
const img=q.img||q.rep.every(r=>r.startsWith("http")&&r.includes(".png"));
const LETTRES=["A","B","C","D"];
if(img){const g=document.createElement("div");g.className="grid-img";
q.rep.forEach((r,i)=>{const b=document.createElement("button");b.className="rep imgmode";b.dataset.l=LETTRES[i];
b.innerHTML='<img src="'+r+'"><div class="badge-opt">Option '+LETTRES[i]+"</div>";b.onclick=()=>repondre(i);g.appendChild(b);});z.appendChild(g);}
else{const g=document.createElement("div");g.className="grid-rep";
q.rep.forEach((r,i)=>{const b=document.createElement("button");b.className="rep";b.dataset.l=LETTRES[i];
b.textContent=r;b.id="rep-"+i;b.onclick=()=>repondre(i);z.appendChild(b);});z.appendChild(g);}
demarrerChrono();}

function demarrerChrono(){clearInterval(timer);
timer=setInterval(()=>{chrono--;majChrono();tick();
if(chrono<=0){clearInterval(timer);tempsEcoule();}},1000);}
function majChrono(){document.getElementById("val-chrono").textContent=chrono+"s";
document.getElementById("box-chrono").className="box"+(chrono<=10?" alerte":"");}
function tempsEcoule(){buzzer();vibrer([0,450]);mascEtat("triste");setTimeout(suivante,900);}

function repondre(i){
if(verrou)return;verrou=true;clearInterval(timer);
const q=questions[idx];
document.querySelectorAll(".rep").forEach((b,j)=>{if(j===q.ok)b.classList.add("bonne");else if(j===i)b.classList.add("faute");b.onclick=null;});
if(i===q.ok){fanfare();vibrer([0,120,80,120]);confetti();mascEtat("content");
score+=(idx+1)*100+chrono*10;document.getElementById("val-score").textContent=score;}
else{buzzer();vibrer([0,380]);mascEtat("triste");}
setTimeout(suivante,1600);}

function suivante(){
if(idx<questions.length-1){idx++;afficherQuestion();}
else{stopAmbiance();document.getElementById("score-final").textContent=score;
document.getElementById("titre-obtenu").textContent="🏆 Titre atteint : "+(NIVEAUX[idx]||NIVEAUX[NIVEAUX.length-1]);
[523,659,784,1046].forEach((f,i)=>note(f,i*.2,.35,"triangle",.15));confetti();ecran("screen-end");}}

function retourAccueil(){afficherAccueil();}
function majGadgets(){document.getElementById("g-fifty").disabled=!dispo.fifty;document.getElementById("g-genie").disabled=!dispo.genie;document.getElementById("g-temps").disabled=!dispo.temps;}

function gadget(t){
if(verrou)return;clic();const q=questions[idx];
if(t==="fifty"&&dispo.fifty){
q.rep.map((r,i)=>i).filter(i=>i!==q.ok).slice(0,2).forEach(i=>{const b=document.getElementById("rep-"+i);if(b)b.classList.add("desactive");});
dispo.fifty=false;}
else if(t==="genie"&&dispo.genie){dire("Je conseille la réponse numéro "+(q.ok+1));alert("🧞‍♂️ Le Génie conseille l'option "+["A","B","C","D"][q.ok]+" !");dispo.genie=false;}
else if(t==="temps"&&dispo.temps){chrono+=10;majChrono();alert("⏸️ +10 secondes !");dispo.temps=false;}
majGadgets();}
function parler(){clic();const msg={fr:"Je croise les pattes pour toi !",pt:"Estou torcendo por você!",en:"I'm rooting for you!"};dire(msg[langue?langue.code:"fr"]||msg.fr);}
</script>
